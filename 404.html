<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Page not found — Leonardo Baptiste</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0D0D12" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="assets/vendor-icon.png" />
  <link rel="stylesheet" href="styles.css?v=54" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("lb-scheme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-scheme", saved);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    .err {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .err__code {
      color: var(--brand);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .err__title {
      margin-top: 12px;
      font-size: clamp(26px, 5vw, 36px);
      letter-spacing: -0.03em;
    }
    .err__msg {
      margin-top: 12px;
      max-width: 44ch;
      color: var(--ink-2);
      font-size: 16px;
    }
    .err__cta { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="err">
    <div>
      <p class="err__code">Error 404</p>
      <h1 class="err__title">This page doesn't exist</h1>
      <p class="err__msg">
        The link may be outdated, or the page was moved somewhere else.
      </p>
      <div class="err__cta">
        <a class="btn btn--primary" href="./">Back to home</a>
        <a class="btn" href="https://t.me/leonardoPhl" target="_blank" rel="noopener noreferrer">
          Message me
        </a>
      </div>
    </div>
  </main>
</body>
</html>
