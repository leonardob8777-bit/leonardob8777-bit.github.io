  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/avatar.jpg" />

  <!-- El ?v= evita que el navegador use una versión vieja en caché.
       Subí el número cada vez que edites styles.css. -->
  <link rel="stylesheet" href="styles.css?v=26" />
</head>

<body>
  <!-- Fondo: malla cyber animada + resplandor + barrido + glitches -->
  <div class="mesh" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>

  <!-- Agujero negro de la esquina superior. Capas, de atrás hacia
       adelante: lente que distorsiona el fondo, disco de acreción,
       materia cayendo, anillo de fotones y el vacío negro.
       Ver el bloque "AGUJERO NEGRO" en styles.css. -->
  <div class="bh" aria-hidden="true">
    <div class="bh__halo"></div>
    <!-- Arcos LENTEADOS: la luz del disco lejano se curva y aparece
         por encima y por debajo de la esfera (van DETRÁS) -->
    <div class="bh__arc bh__arc--top"><i></i></div>
    <div class="bh__arc bh__arc--bottom"><i></i></div>
    <div class="bh__lens"></div>
    <!-- Neblina del disco: le da VOLUMEN a las líneas brillantes -->
    <div class="bh__glow"></div>
    <div class="bh__core"></div>
    <div class="bh__ring"></div>
    <!-- Banda CERCANA: cruza por delante de la esfera.
         La segunda es el núcleo incandescente, más fino y brillante. -->
    <div class="bh__band"><i></i></div>
    <div class="bh__band bh__band--hot"><i></i></div>
    <!-- Lado que gira HACIA nosotros: brilla mucho más (Doppler) -->
    <div class="bh__band bh__band--dop"><i></i></div>
    <div class="bh__debris">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="glitch" aria-hidden="true"></div>

  <!-- Si el JavaScript no carga, la página quedaría vacía: este aviso
       evita que el visitante vea una pantalla en blanco. -->
  <noscript>
    <div class="noscript">
      <h1>Leonardo Bt</h1>
      <p>This page needs JavaScript enabled. Please turn it on and reload.</p>
      <p><a href="https://t.me/leonardoPhl">Contact me on Telegram</a></p>
    </div>
  </noscript>

  <a class="skip" href="#content">Skip to content</a>

  <div class="page">
    <!-- ================= HERO / PERFIL ================= -->
    <header class="hero">
      <div class="avatar-wrap">
        <img class="avatar" src="assets/avatar.jpg"
             alt="Leonardo Bt profile photo" width="112" height="112" fetchpriority="high" />
      </div>

      <!-- data-text = el mismo texto: lo usan las capas del glitch -->
      <h1 class="name" data-text="Leonardo Bt">Leonardo Bt</h1>
      <p class="handle">@leonardo.bt4</p>

      <!-- Indicador "live": el punto late y el texto lo pone el JS -->
      <div class="status" id="status" role="status">
        <span class="status__dot" aria-hidden="true"></span>
        <span class="status__text">Checking status…</span>
      </div>

      <p class="bio">Signed IPAs, certificates and guides — everything in one place.</p>
    </header>

    <!-- ================= NAV DE CATEGORÍAS ================= -->
    <!-- Se genera desde script.js a partir de las secciones -->
    <nav class="catnav" id="catnav" role="tablist" aria-label="Categories"></nav>

    <!-- ================= SECCIONES ================= -->
    <!-- Todo el contenido lo dibuja script.js -->
    <main id="content"></main>

    <footer class="footer">
      <p>© <span id="year"></span> Leonardo Bt · Made with ♥</p>
      <p class="footer__note">Not affiliated with Apple Inc. Use at your own risk.</p>
    </footer>
  </div>

  <script src="script.js?v=26" defer></script>
</body>
</html>
