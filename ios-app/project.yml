# =====================================================================
# Receta del proyecto de Xcode (formato XcodeGen)
# ---------------------------------------------------------------------
# En vez de guardar un archivo .xcodeproj (que es enorme y se rompe
# fácil), acá se describe el proyecto en texto y GitHub lo genera solo
# en cada compilación. Es más fácil de leer y de modificar.
#
# Para cambiar el nombre de la app: PRODUCT_NAME y CFBundleDisplayName
# (este último está en Sources/Info.plist).
# =====================================================================

name: LB

options:
  bundleIdPrefix: io.github.leonardob8777bit
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  LB:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources

    settings:
      base:
        PRODUCT_NAME: LB
        PRODUCT_BUNDLE_IDENTIFIER: io.github.leonardob8777bit.lb
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"        # 1 = solo iPhone
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO

        # Se compila SIN firmar: el .ipa se firma después con KSign
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
