# =====================================================================
# COMPILA LA APP Y GENERA EL .ipa  (sin necesidad de tener una Mac)
# ---------------------------------------------------------------------
# GitHub presta máquinas con macOS y Xcode ya instalado. Este flujo:
#   1. genera el proyecto de Xcode a partir de ios-app/project.yml
#   2. compila la app SIN firmar
#   3. la empaqueta como .ipa
#   4. la deja lista para descargar
#
# El .ipa sale sin firmar a propósito: se firma después con KSign en el
# iPhone, usando tu certificado — el mismo proceso de la guía del sitio.
#
# CÓMO EJECUTARLO:
#   Pestaña "Actions" del repo → "Build iOS app (.ipa)" → "Run workflow"
#   Cuando termine, el .ipa aparece abajo en "Artifacts".
# =====================================================================

name: Build iOS app (.ipa)

on:
  # Botón manual en la pestaña Actions
  workflow_dispatch:

  # Y automático cuando se toca algo de la app
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    name: Compilar IPA sin firmar
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # XcodeGen 2.45+ genera el proyecto en formato de Xcode 16. Si el
      # runner usa un Xcode viejo (p. ej. 15.4), xcodebuild no lo puede
      # leer ("Unable to read project"). Elegimos el Xcode más nuevo
      # instalado para que el formato coincida.
      - name: Usar el Xcode más nuevo del runner
        run: |
          NUEVO=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NUEVO" ]; then
            sudo xcode-select -s "$NUEVO"
          fi
          echo "::warning::[diag] Xcode activo: $(xcodebuild -version 2>&1 | tr '\n' ' ')"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        working-directory: ios-app
        run: xcodegen generate

      # Paso solo informativo: NO debe cortar la compilación si falla.
      # Vuelca lo que XcodeGen generó tanto al Summary como a anotaciones
      # (::warning::), que se pueden leer por la API pública sin login.
      - name: Ver qué generó XcodeGen
        working-directory: ios-app
        continue-on-error: true
        run: |
          {
            echo "## 🔎 Diagnóstico XcodeGen"
            echo '### Contenido de ios-app'
            echo '```'; ls -la; echo '```'
            echo '### Proyectos .xcodeproj encontrados'
            echo '```'; ls -d *.xcodeproj 2>/dev/null || echo "NINGUNO"; echo '```'
            echo '### Versiones'
            echo '```'; xcodebuild -version 2>&1 || true; xcodegen --version 2>&1 || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          PROJ=$(ls -d *.xcodeproj 2>/dev/null | tr '\n' ' ')
          echo "::warning::[diag] xcodeproj: ${PROJ:-NINGUNO}"
          echo "::warning::[diag] ios-app: $(ls -1 | tr '\n' ' ')"
          echo "::warning::[diag] $(xcodebuild -version 2>&1 | tr '\n' ' ')"
          echo "::warning::[diag] xcodegen $(xcodegen --version 2>&1 | tr '\n' ' ')"

      - name: Compilar (sin firmar)
        working-directory: ios-app
        run: |
          set -o pipefail
          # Auto-detectar el nombre real del proyecto en vez de asumirlo.
          PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1)
          if [ -z "$PROJ" ]; then
            echo "::error::XcodeGen no generó ningún .xcodeproj en ios-app"
            exit 1
          fi
          echo "Compilando proyecto: $PROJ"
          xcodebuild \
            -project "$PROJ" \
            -scheme LB \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee compilacion.log

      # Si falla, dejamos los errores bien a la vista al final del
      # registro, en vez de tener que bucear entre miles de líneas.
      - name: Mostrar los errores
        if: failure()
        working-directory: ios-app
        run: |
          # 1) Resumen legible en la pestaña "Summary" del run.
          {
            echo "## ❌ Errores de compilación"
            echo ""
            echo '```'
            grep -E "error:|fatal error:|The following build commands failed|Command .* failed with" compilacion.log | sort -u | head -40 || true
            echo '```'
            echo ""
            echo "### Últimas 60 líneas del registro"
            echo '```'
            tail -60 compilacion.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 2) Cada error como anotación de workflow. Las anotaciones se
          #    leen por la API pública SIN login, así se puede diagnosticar
          #    a distancia sin tener que copiar y pegar a mano.
          echo "============= ERRORES ENCONTRADOS ============="
          grep -E "error:|fatal error:" compilacion.log | sort -u | head -30 | while IFS= read -r linea; do
            limpia=$(printf '%s' "$linea" | tr '\r\n' '  ')
            echo "::error::${limpia}"
          done || true
          echo "============= ÚLTIMAS 60 LÍNEAS =============="
          tail -60 compilacion.log || true

      - name: Guardar el registro completo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-compilacion
          path: ios-app/compilacion.log
          if-no-files-found: ignore

      - name: Empaquetar como .ipa
        working-directory: ios-app
        run: |
          APP="build/Build/Products/Release-iphoneos/LB.app"
          if [ ! -d "$APP" ]; then
            echo "No se generó la app en $APP"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LB-unsigned.ipa Payload
          echo "IPA listo:"
          ls -lh LB-unsigned.ipa

      - name: Publicar el .ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: LB-unsigned-ipa
          path: ios-app/LB-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
